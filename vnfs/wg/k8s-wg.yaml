apiVersion: v1
kind: Namespace
metadata:
  name: vnf
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wg-config-pvc
  namespace: vnf
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wg-easy
  namespace: vnf
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wg-easy
  template:
    metadata:
      labels:
        app: wg-easy
    spec:
      nodeSelector:
        kubernetes.io/hostname: cp
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      containers:
        - name: wg-easy
          image: ghcr.io/wg-easy/wg-easy:15
          imagePullPolicy: IfNotPresent
          env:
            - name: WG_DEVICE
              value: "eth0"
            - name: PORT
              value: "51821"
            - name: INSECURE
              value: "true"
            - name: DISABLE_IPV6
              value: "true"
            - name: LANG
              value: "en"
          ports:
            - name: wireguard
              containerPort: 51820
              protocol: UDP
            - name: web
              containerPort: 51821
              protocol: TCP
          securityContext:
            privileged: true
            capabilities:
              add:
                - NET_ADMIN
          readinessProbe:
            tcpSocket:
              port: web
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: web
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: wg-config
              mountPath: /etc/wireguard
            - name: dev-net-tun
              mountPath: /dev/net/tun
      volumes:
        - name: wg-config
          persistentVolumeClaim:
            claimName: wg-config-pvc
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
---
apiVersion: v1
kind: Service
metadata:
  name: wg-easy-vpn
  namespace: vnf
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app: wg-easy
  ports:
    - name: wireguard
      protocol: UDP
      port: 51810
      targetPort: 51810
      nodePort: 31820
---
apiVersion: v1
kind: Service
metadata:
  name: wg-easy-web
  namespace: vnf
spec:
  type: NodePort
  selector:
    app: wg-easy
  ports:
    - name: web
      protocol: TCP
      port: 51821
      targetPort: 51821
      nodePort: 31821
